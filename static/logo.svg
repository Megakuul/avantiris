<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none">
  <title>Avantiris</title>
  <style>
    .pupil { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .frame { stroke-dasharray: 1; animation: draw 0.9s ease-out both; }
      .pupil { animation: look 1.5s 0.5s ease-in-out both; }
    }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes look {
      0% { transform: translateX(-3px) scale(0); }
      45% { transform: translateX(-3px) scale(1); }
      100% { transform: translateX(0) scale(1); }
    }
  </style>
  <path class="frame" d="M13.5 9.5 24 3 45 16 24 29 3 16Z" pathLength="1" stroke="#000" stroke-width="3"/>
  <circle class="pupil" cx="27" cy="16" r="6" fill="#000"/>
</svg>
